name: test

on:
  push:
    branches: [main]
  pull_request:

# Only a few macOS runners are available at a time, so a newer push cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The app needs the macOS 26 SDK, which only this image carries.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen
      # The coverage check reads what the tests ran with the Rust toolchain's own llvm-cov.
      - run: rustup component add llvm-tools
      - name: lint the backend and the coverage check
        run: |
          (cd backend && cargo clippy --locked --all-targets -- -D warnings)
          (cd scripts/coverage && cargo clippy --locked --all-targets -- -D warnings)
      # Every test of the backend and of the app, with coverage. It fails if a test fails, and
      # if a line or a function of the logic ran under no test.
      - name: test, and check that the tests run every line of the logic
        run: scripts/coverage.sh
      - name: animations are what the script writes
        run: |
          python3 scripts/make-animations.py
          git diff --exit-code -- AirFlow/Resources/Animations
